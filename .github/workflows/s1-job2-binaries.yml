name: S1 Job2 binaries

# Publishes the boot-class lab (Job 2) binaries as individual public artifacts so Lab04 can run the
# job without building or running any LiberNT code on their host (LAB04-S1-BOOTCLASS-HANDOFF.md).
# Manual only (workflow_dispatch). The same file is committed to every branch it is dispatched on; it
# builds whichever of the wanted targets exist on that branch and uploads only those (if-no-files-found:
# ignore), so:
#   - on leeway/s1-boot-drivers      -> kit (applier, CLI, bootstrap) + stubs
#   - on test/s1-bootclass-lab       -> good-leg kernel/userland binaries (ntoskrnl, hal, bootvid, ntdll,
#                                        win32k, winlogon) that carry the loader
#   - on test/s1-k3-broken           -> the deliberately-non-booting ntoskrnl
# Each binary ships with a .sha256 inside its artifact; the artifact zip's own sha256 is what Lab04 pins.

on:
  workflow_dispatch:

concurrency:
  group: s1-job2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  job2:
    runs-on: ubuntu-24.04
    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/lib/jvm /usr/local/share/powershell /usr/local/share/chromium
        sudo docker system prune --all --force
        df -h /

    - name: Source checkout
      uses: actions/checkout@v6

    - name: Install host build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build flex bison ccache wget xz-utils tar python3-mako python3-yaml python3-packaging glslang-tools msitools

    - name: Compute RosBE bootstrap SHA
      id: rosbe_spec
      run: |
        curl -fsSL https://raw.githubusercontent.com/LiberNT/libernt-build-toolchain/main/rosbe-unix-bootstrap.sh -o /tmp/rosbe-bootstrap.sh
        echo "sha=$(sha1sum /tmp/rosbe-bootstrap.sh | awk '{print $1}')" >> "$GITHUB_OUTPUT"

    - name: Cache RosBE
      id: cache_rosbe
      uses: actions/cache@v5
      with:
        path: ~/.local/opt/rosbe
        key: rosbe-${{runner.os}}-${{steps.rosbe_spec.outputs.sha}}

    - name: Install RosBE
      if: ${{ steps.cache_rosbe.outputs.cache-hit != 'true' }}
      run: sh /tmp/rosbe-bootstrap.sh

    - name: Restore ccache
      id: ccache_restore
      uses: actions/cache/restore@v5
      with:
        path: ccache
        key: ccache-clang-amd64-job2-${{github.run_id}}-${{github.run_attempt}}
        restore-keys: |
          ccache-clang-amd64-job2-
          ccache-clang-amd64-

    - name: Set ccache settings
      run: |
        echo "CCACHE_BASEDIR=${{github.workspace}}" >> $GITHUB_ENV
        echo "CCACHE_DIR=${{github.workspace}}/ccache" >> $GITHUB_ENV
        echo "CCACHE_MAXSIZE=1G" >> $GITHUB_ENV
        echo "CCACHE_SLOPPINESS=time_macros" >> $GITHUB_ENV

    - name: Configure
      id: configure
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        . "$HOME/.local/opt/rosbe/rosbe-env.sh"
        ./configure.sh --clang -a amd64 \
          -DREACTOS_TARGET_NT=0xA00 \
          -DDIAGDATA_CHANNEL= \
          -DLIBERNT_BUILD_UPDATE_PENDING=ON \
          -DLIBERNT_BUILD_S1_LABSTUBS=ON \
          -DLIBERNT_BUILD_UPDATE_CLI=ON \
          -DENABLE_CCACHE=1
        echo "outdir=output-Clang-amd64-debug" >> "$GITHUB_OUTPUT"

    - name: Build submodules
      run: |
        . "$HOME/.local/opt/rosbe/rosbe-env.sh"
        ninja -C ${{steps.configure.outputs.outdir}} submodules

    - name: Build Job 2 targets (whichever exist on this branch)
      run: |
        . "$HOME/.local/opt/rosbe/rosbe-env.sh"
        OUT=${{steps.configure.outputs.outdir}}
        WANT="libernt-update libernt-update-bootstrap LiberNTUpdatePending lnfailstub lnokstub lnfailstub_smss lnfailstub_win32 ntoskrnl ntdll win32k hal bootvid winlogon"
        avail=$(ninja -C "$OUT" -t targets all | cut -d: -f1)
        build=""
        for t in $WANT; do
          if grep -qx "$t" <<<"$avail"; then build="$build $t"; else echo "::notice::target not on this branch: $t"; fi
        done
        echo "building:$build"
        if [ -n "$build" ]; then ninja -C "$OUT" -k0 $build; fi

    - name: Collect binaries + sha256
      id: collect
      run: |
        OUT=${{steps.configure.outputs.outdir}}
        mkdir -p job2
        collect() { # <filename> <artifact-subdir>
          f=$(find "$OUT" -name "$1" -type f | head -n1)
          if [ -n "$f" ]; then
            d="job2/$2"; mkdir -p "$d"; cp "$f" "$d/$1"
            ( cd "$d" && sha256sum "$1" | tee "$1.sha256" && echo "bytes: $(wc -c < "$1")" )
          else
            echo "::notice::not built on this branch: $1"
          fi
        }
        collect LiberNTUpdatePending.exe   applier
        collect libernt-update.exe         cli
        collect libernt-update-bootstrap.exe bootstrap
        collect lnfailstub.sys             stub-driver-bad
        collect lnokstub.sys               stub-driver-good
        collect lnfailstub_smss.exe        stub-smss-bad
        collect lnfailstub_win32.exe       stub-win32-bad
        collect ntoskrnl.exe               kernel
        collect ntkrnlmp.exe               kernel-mp
        collect ntdll.dll                  ntdll
        collect win32k.sys                 win32k
        collect hal.dll                    hal
        collect bootvid.dll                bootvid
        collect winlogon.exe               winlogon
        echo "=== collected ==="; find job2 -type f | sort

    - name: Name artifacts
      id: tag
      run: echo "tag=clang-amd64-${GITHUB_SHA::11}" >> "$GITHUB_OUTPUT"

    # One artifact per binary (Lab04 pins each zip's sha256). if-no-files-found: ignore so the same
    # workflow is a no-op for the binaries a given branch does not build.
    - uses: actions/upload-artifact@v7
      with: { name: "s1job2-applier-${{steps.tag.outputs.tag}}",   path: "job2/applier",   if-no-files-found: ignore }
    - uses: actions/upload-artifact@v7
      with: { name: "s1job2-cli-${{steps.tag.outputs.tag}}",       path: "job2/cli",       if-no-files-found: ignore }
    - uses: actions/upload-artifact@v7
      with: { name: "s1job2-bootstrap-${{steps.tag.outputs.tag}}", path: "job2/bootstrap", if-no-files-found: ignore }
    - uses: actions/upload-artifact@v7
      with: { name: "s1job2-stub-driver-bad-${{steps.tag.outputs.tag}}",  path: "job2/stub-driver-bad",  if-no-files-found: ignore }
    - uses: actions/upload-artifact@v7
      with: { name: "s1job2-stub-driver-good-${{steps.tag.outputs.tag}}", path: "job2/stub-driver-good", if-no-files-found: ignore }
    - uses: actions/upload-artifact@v7
      with: { name: "s1job2-stub-smss-bad-${{steps.tag.outputs.tag}}",    path: "job2/stub-smss-bad",    if-no-files-found: ignore }
    - uses: actions/upload-artifact@v7
      with: { name: "s1job2-stub-win32-bad-${{steps.tag.outputs.tag}}",   path: "job2/stub-win32-bad",   if-no-files-found: ignore }
    - uses: actions/upload-artifact@v7
      with: { name: "s1job2-kernel-${{steps.tag.outputs.tag}}",     path: "job2/kernel",     if-no-files-found: ignore }
    - uses: actions/upload-artifact@v7
      with: { name: "s1job2-kernel-mp-${{steps.tag.outputs.tag}}",  path: "job2/kernel-mp",  if-no-files-found: ignore }
    - uses: actions/upload-artifact@v7
      with: { name: "s1job2-ntdll-${{steps.tag.outputs.tag}}",      path: "job2/ntdll",      if-no-files-found: ignore }
    - uses: actions/upload-artifact@v7
      with: { name: "s1job2-win32k-${{steps.tag.outputs.tag}}",     path: "job2/win32k",     if-no-files-found: ignore }
    - uses: actions/upload-artifact@v7
      with: { name: "s1job2-hal-${{steps.tag.outputs.tag}}",        path: "job2/hal",        if-no-files-found: ignore }
    - uses: actions/upload-artifact@v7
      with: { name: "s1job2-bootvid-${{steps.tag.outputs.tag}}",    path: "job2/bootvid",    if-no-files-found: ignore }
    - uses: actions/upload-artifact@v7
      with: { name: "s1job2-winlogon-${{steps.tag.outputs.tag}}",   path: "job2/winlogon",   if-no-files-found: ignore }
